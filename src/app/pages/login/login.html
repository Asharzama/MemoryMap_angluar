<main class="login-page">

  <section class="login-card">

    <h1>Travel Memory Map</h1>

    <h2>Login</h2>

    <form (ngSubmit)="login()">

      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="you@example.com"
          required
        >

      </div>


      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Password"
          required
        >

      </div>


      <button
        type="submit"
      >
        Login
      </button>

    </form>

  </section>

</main>
